# Pre-commit hooks (Data Analysis Playbook v3.6, Part V → Automated Checks).
# They run on every `git commit` and stop the commit when a check fails.
#
#   Set up once per clone:   pip install pre-commit && pre-commit install
#   Run on every file:       pre-commit run --all-files
#   Skip in an emergency:    git commit --no-verify   (say why in the pull request)
#
# Notebook outputs are kept: check_figures.py uses them as evidence, so no hook strips them.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Stops a raw data file being committed by accident (5 MB limit).
      - id: check-added-large-files
        args: ["--maxkb=5000"]
      # Stops private keys, including the one inside a cloud service-account JSON file.
      - id: detect-private-key
      # Stops a file with unresolved merge markers (<<<<<<<).
      - id: check-merge-conflict

  - repo: local
    hooks:
      # Empty cells, cells run out of order, saved errors and absolute local paths.
      - id: check-notebooks
        name: notebook checks (playbook)
        entry: python3 tools/check_notebooks.py
        language: system
        files: \.ipynb$
      # Every figure in the README and project pages must be found in the outputs.
      - id: check-figures
        name: figures in text (playbook)
        entry: python3 tools/check_figures.py .
        language: system
        files: ^(README\.md|docs/)
        pass_filenames: false
